[ids]
*
[main]
capslock = layer(capslock)
enter = overload(enter, enter)
tab = overload(tab, tab)
[capslock]
p = backspace
leftbrace = esc
backslash = leftmeta
h = left
j = down
k = up
l = right
semicolon = leftmouse
apostrophe = rightmouse
2 = M-2
3 = M-3
4 = M-4
5 = M-5
6 = M-6
7 = M-7
8 = M-8
9 = M-9
0 = M-0
[capslock+shift]
space = M-up
n = M-left
m = M-right
# Input sources, picked by the lang-keys GNOME extension
f = command(/usr/local/bin/lang-keys us)
d = command(/usr/local/bin/lang-keys ru)
s = command(/usr/local/bin/lang-keys mozc-jp)
[enter:C]
[tab:C]
