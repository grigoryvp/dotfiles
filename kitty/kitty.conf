# Mirrors iterm/Scripts/AutoLaunch/settings.py where kitty has an equivalent

font_family JetBrains Mono
font_size 12

enable_audio_bell no
# As on macOS: Enter is a newline in multiline prompts, m3 (sent by keyd as
# keypad Enter) submits. Shells see shift+enter as plain Enter.
map enter send_key shift+enter
map kp_enter send_key enter

# Tabs as in a browser. Shells and vim no longer get these keys.
map ctrl+t new_tab
map ctrl+w close_tab
# m1-s, sent by keyd as F1: closes a single split, as in iTerm
map f1 close_window

# Claude Code's idle reminder, sent via the iTerm2 OSC 9 protocol
filter_notification title:"(?i)claude is waiting" or body:"(?i)claude is waiting"
confirm_os_window_close 0
scrollbar never

# Positive value also fades the only window when kitty is unfocused, like
# iTerm's "dim background windows"
inactive_text_alpha 0.4

# "splits" allows arbitrary split sizes, "stack" zooms the current split
enabled_layouts splits,stack

tab_bar_edge left
tab_bar_min_tabs 1
# Default "fade" style wastes cells on each side of every tab
tab_bar_style separator
tab_separator ""
# Sidebar width, in cells
tab_title_max_length 24
# Index without bell and activity indicators
tab_title_template "{index}: {title}"
